<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open a shared mod in Hyperix Launcher." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <title>Open mod in Hyperix</title>
    <link rel="icon" type="image/png" href="./assets/hyperix-logo.png" />
    <link rel="stylesheet" href="./open-mod.css" />
    <script src="./open-mod.js" defer></script>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="./"><img src="./assets/hyperix-logo.png" alt="" /> Hyperix Launcher</a>
      <span class="eyebrow">SHARED MOD</span>
      <h1 id="heading">Open this mod in Hyperix</h1>
      <p id="description">This link opens the mod detail page in the desktop app. It will not install anything automatically.</p>
      <p class="identity" id="identity" hidden></p>
      <a class="open-button" id="open-button" hidden>Open in Hyperix</a>
      <p class="hint" id="hint">If Hyperix is not installed, <a href="./">get the launcher</a>.</p>
    </main>
  </body>
</html>
