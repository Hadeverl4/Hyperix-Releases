<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open a shared mod in Hyperix Launcher." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <title>Mở mod bằng Hyperix</title>
    <link rel="icon" type="image/png" href="./assets/hyperix-logo.png" />
    <link rel="stylesheet" href="./open-mod.css" />
    <script src="./open-mod.js" defer></script>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="./"><img src="./assets/hyperix-logo.png" alt="" /> Hyperix Launcher</a>
      <span class="eyebrow">MOD ĐƯỢC CHIA SẺ</span>
      <h1 id="heading">Xem mod này trong Hyperix</h1>
      <p id="description">Liên kết sẽ mở thông tin mod trong ứng dụng Hyperix, không tự động cài đặt.</p>
      <p class="identity" id="identity" hidden></p>
      <a class="open-button" id="open-button" hidden>Mở bằng Hyperix</a>
      <p class="hint" id="hint">Chưa cài Hyperix? <a href="./">Tải trình khởi chạy tại đây</a>.</p>
    </main>
  </body>
</html>
